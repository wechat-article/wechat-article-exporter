# down.mptext.top 的下线落地页：只有静态资源，没有 Worker 脚本，请求不计入 Workers 额度。
# 自定义域在 Cloudflare 控制台绑定，这里不声明路由。
name = "down-mptext-shutdown"
compatibility_date = "2026-10-01"
workers_dev = true

# 首页 200；旧站的其余路径（/dashboard/*、/api/* 等）返回 404，正文仍是这张页面。
# 旧地址已经没有对应内容，返回 200 会被搜索引擎当成软 404 一直留在索引里，404 才会被移出。
# public/404.html 是部署前从 index.html 复制的，不进仓库。
[assets]
directory = "./public"
not_found_handling = "404-page"
